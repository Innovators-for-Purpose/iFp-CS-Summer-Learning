<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Profile</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ==============================
         PROFILE CARD
    ============================== -->
    <div>
        <img class="drawing" src="sample-drawing.png" alt="my-drawing">
    </div>

    <div class="img-container">
        <img class="img-normal" src="hachiware.png" alt="">
        <img class="img-hover" src="hachiware2.png" alt="">
    </div>

    <div class="profile-card">

        <!-- Profile Image -->
        <img
            class="profile-image"
            src="https://placehold.co/200"
            alt="Profile Picture"
        >

        <!-- Student Name -->
        <h1>Bela</h1>

        <!-- Short Tagline -->
        <h3>Computer Science Mentor</h3>

        <!-- ==============================
             INFORMATION BOX
        ============================== -->
        <div class="info-box">

            <h2 id="section-title">
                About Me
            </h2>

            <p id="description">
                Hola! My name is Bela!
                I enjoy technology, games, and learning new things.
            </p>

        </div>

        <!-- ==============================
             BUTTONS
        ============================== -->
        <div class="button-container">

            <button onclick="showAbout()">
                About Me
            </button>

            <button onclick="showSkills()">
                Skills
            </button>

            <button onclick="showExp()">
                Experience
            </button>

            <button onclick="showInterests()">
                Interests
            </button>

        </div>
        <talking-button></talking-button>
    </div>
    <script src="script.js"></script>
</body>
</html>
