<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Talking Button Demo</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
  </head>
  <body>
    <main class="container">
        <h1>Talking Button Demo</h1>
        <p>Click the small round button to open a message box.</p>

        <button class="talking-button" onclick="openDialogue()"></button>
         <div class="dialogue-box" id="dialogue-box">
          <p>Hello!</p>
          <button onclick="showOptionOne()">What are you?</button>
          <button onclick="showOptionTwo()">How are you?</button>
          <button onclick="showOptionThree()">Whos Avry?</button>
          <p id="response">Choose an option.</p>
        <div>


    </main>

    <script src="script.js"></script>
  </body>
</html>
