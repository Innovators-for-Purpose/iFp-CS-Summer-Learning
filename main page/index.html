<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../chatbot/style.css">
</head>
<body>
    <div class="profile-card">
        <img id="Images" src="../images/funky-cat.jpg" 
        alt="A Funny Cat Image" height="400" width="400">
        <h1>Magan Farah</h1>
        <h3>My Portfolio</h3>
        <div class="info-box">
            <h2 id="Title">
                About Me                
            </h2>
            <p id="Description">
                Hello! My name is Magan. I am an asipiring game developer who is interested in the story telling narrative aspect of games and the interesting complexities of game mechanics.</p>
        </div>
        <div class="buttons-container">
            <button onclick="showAbout()">
                About Me
            </button>

            <button onclick="showSkills()">
                Skills
            </button>

            <button onclick="showExperience()">
                Experience
            </button>

            <button onclick="showInterests()">
                Interests
            </button>

            <button onclick="showVideo()">
                Cat Video
            </button>

            <button onclick="showGenius()">
                Genius Project
            </button>
        </div>
    </div>
    <button class="talking-button" onclick="openDialog()">💬</button>
    <div class="dialog-box" id="dialog_box">
        <p>Need Some help?</p>
        <div class="Button-options">
        <button class="Button" onclick="showOptionOne()">Option 1</button>
        <button class="Button" onclick="showOptionTwo()">Option 2</button>
        <button class="Button" onclick="showOptionThree()">Option 3</button>
        </div>
        <p id="response">Choose an option.</p>
    </div>
    
    <script src="script.js"></script>
    <script src="../chatbot/script.js"></script>
</body>
</html>
